name: release

# Deployment lane (slice 0007): a v* tag push builds, packs, checksums, and
# attaches the product artifact to a GitHub Release. Scoped exactly to tagged
# pushes - never pull requests, never branch pushes (A2 constraint).
on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN, scoped to repository contents, is the only
# credential (recorded in the A4 blast radius). CI never moves tags; assets
# are never re-uploaded - `gh release create`/`gh release upload` fail loudly
# on a pre-existing release/asset instead of replacing it (immutability).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Record what is being built
        run: |
          echo "tag:    ${{ github.ref_name }}"
          echo "commit: ${{ github.sha }}"

      - name: Install
        run: npm ci

      - name: Build and test
        # Deliberate decision (A2): the full fast lane already greened the PR
        # that produced this tag; re-running it on a duplicated checkout
        # cannot strengthen that evidence. npm test fails loud on a broken
        # tree and keeps the runner small.
        run: |
          npm run build
          npm test

      - name: Assert the tag names the packaged version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version v${version}"
            exit 1
          fi

      - name: Pack
        # Fixed contents list (A2 v2): dist, the shared engines the CLI imports
        # at runtime, the package manifest (name/version/bin), and the README.
        # No node_modules, no secrets, no git history. The layout mirrors the
        # repo so every relative specifier inside the artifact keeps resolving.
        run: |
          mkdir -p "pack/factory-cli-${{ github.ref_name }}/scripts/ci/lib"
          cp -r dist "pack/factory-cli-${{ github.ref_name }}/"
          cp scripts/ci/lib/*.mjs "pack/factory-cli-${{ github.ref_name }}/scripts/ci/lib/"
          cp package.json README.md "pack/factory-cli-${{ github.ref_name }}/"
          zip -r "factory-cli-${{ github.ref_name }}.zip" pack

      - name: Checksum
        run: |
          sha256sum "factory-cli-${{ github.ref_name }}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          version="$(node -p "require('./package.json').version")"
          awk -v section="## [${version}]" '
            $0 ~ /^## \[/ { if (found) exit; if ($0 == section) found = 1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release notes: see CHANGELOG.md section [${version}]." > release-notes.md
          fi
          cat release-notes.md

      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "factory-cli ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --verify-tag
          gh release upload "${{ github.ref_name }}" \
            "factory-cli-${{ github.ref_name }}.zip" SHA256SUMS
